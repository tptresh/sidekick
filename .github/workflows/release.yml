name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release from (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Sidekick.app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      # make app ad-hoc signs the bundle. There is no Developer ID certificate
      # and nothing is notarized, so the download is quarantined on the user's
      # Mac; release-notes-header.md is the one-line fix they need.
      - name: Build the app bundle
        run: make app

      - name: Zip the bundle
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/Sidekick.app "dist/Sidekick-$TAG.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat .github/release-notes-header.md
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body
          } > dist/notes.md
          gh release create "$TAG" \
            --title "Sidekick $TAG" \
            --notes-file dist/notes.md \
            "dist/Sidekick-$TAG.zip"
